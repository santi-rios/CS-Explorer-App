services:
  shiny-app:
    build: .
    container_name: shiny-chemical
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - shiny-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    # This is the exact command Cloudflare gave you, reading the token from .env
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - shiny-app
    networks:
      - shiny-net

