services:
  shiny-app:
    build: .
    container_name: shiny-chemical
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - shiny-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: shiny-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://shiny-app:8000
    depends_on:
      - shiny-app
    networks:
      - shiny-net

networks:
  shiny-net:
    driver: bridge  

